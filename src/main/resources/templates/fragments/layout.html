<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Controle de Estoque'">Controle de Estoque</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232456d3'/%3E%3Cpath d='M16 7l8 4.5v9L16 25l-8-4.5v-9zM8 11.5l8 4.5 8-4.5M16 16v9' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/static/css/app.css}">
</head>

<body>

<!-- Icones (SVG inline, herdam a cor do texto) -->
<svg th:fragment="iconeCaixa" class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
<svg th:fragment="iconeAlerta" class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
<svg th:fragment="iconeOk" class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
<svg th:fragment="iconeEntrada" class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
<svg th:fragment="iconeSaida" class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
<svg th:fragment="iconeSair" class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>

<!-- Cabecalho com navegacao; o item Produtos mostra a quantidade de alertas -->
<header th:fragment="cabecalho" class="topo">
    <div class="topo-conteudo">
        <a class="marca" th:href="@{/dashboard}">
            <span class="marca-logo"><svg th:replace="~{fragments/layout :: iconeCaixa}"></svg></span>
            <span>Controle de Estoque</span>
        </a>
        <nav class="navegacao" aria-label="Principal">
            <a th:href="@{/dashboard}" th:classappend="${paginaAtiva == 'dashboard'} ? 'ativo'"
               th:attr="aria-current=${paginaAtiva == 'dashboard'} ? 'page' : null">Dashboard</a>
            <a th:href="@{/produtos}" th:classappend="${paginaAtiva == 'produtos'} ? 'ativo'"
               th:attr="aria-current=${paginaAtiva == 'produtos'} ? 'page' : null">
                Produtos
                <span th:if="${totalAlertas > 0}" class="contador-alerta"
                      th:classappend="${alertasSemEstoque > 0} ? 'contador-perigo'"
                      th:text="${totalAlertas}"
                      th:title="${totalAlertas} + ' em alerta de estoque mínimo'">0</span>
            </a>
            <a th:href="@{/movimentacoes}" th:classappend="${paginaAtiva == 'movimentacoes'} ? 'ativo'"
               th:attr="aria-current=${paginaAtiva == 'movimentacoes'} ? 'page' : null">Movimentações</a>
            <a th:href="@{/fornecedores}" th:classappend="${paginaAtiva == 'fornecedores'} ? 'ativo'"
               th:attr="aria-current=${paginaAtiva == 'fornecedores'} ? 'page' : null">Fornecedores</a>
        </nav>
        <div class="sessao">
            <span class="sessao-usuario">
                <strong th:text="${usuarioNome}">Usuário</strong>
                <small th:text="${usuarioPerfil}">Perfil</small>
            </span>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="botao-sair" title="Sair do painel">
                    <svg th:replace="~{fragments/layout :: iconeSair}"></svg><span>Sair</span>
                </button>
            </form>
        </div>
    </div>
</header>

<!-- Faixa de alerta exibida em todas as paginas enquanto houver produtos abaixo do minimo -->
<div th:fragment="alertaGlobal" th:if="${totalAlertas > 0}" class="faixa-alerta"
     th:classappend="${alertasSemEstoque > 0} ? 'faixa-perigo' : 'faixa-atencao'" role="alert">
    <div class="faixa-conteudo">
        <span class="faixa-icone"><svg th:replace="~{fragments/layout :: iconeAlerta}"></svg></span>
        <p>
            <strong th:text="${totalAlertas == 1} ? '1 produto está abaixo do estoque mínimo' : ${totalAlertas} + ' produtos estão abaixo do estoque mínimo'">
                Produtos abaixo do estoque mínimo</strong>
            <span th:if="${alertasSemEstoque > 0}"
                  th:text="${alertasSemEstoque == 1} ? '· 1 sem estoque' : '· ' + ${alertasSemEstoque} + ' sem estoque'"></span>
        </p>
        <a th:unless="${paginaAtiva == 'produtos' and somenteAlertas}" class="faixa-link"
           th:href="@{/produtos(situacao='baixo')}">Ver produtos em alerta</a>
    </div>
</div>

<!-- Selo colorido com a situacao do estoque -->
<span th:fragment="selo(situacao)" class="selo" th:classappend="'selo-' + ${situacao.classe}">
    <span class="selo-ponto" aria-hidden="true"></span><span th:text="${situacao.rotulo}">Situação</span>
</span>

<!-- Barra com a cobertura do estoque minimo -->
<span th:fragment="nivel(produto)" class="nivel" th:classappend="'nivel-' + ${produto.situacao.classe}"
      role="img"
      th:attr="aria-label=${produto.quantidade} + ' de ' + ${produto.estoqueMinimo} + ' unidades do mínimo'">
    <span class="nivel-barra" th:classappend="'largura-' + ${produto.nivelPercentual()}"></span>
</span>

<footer th:fragment="rodape" class="rodape">
    <p>Controle de Estoque · página gerada em
        <time th:datetime="${#temporals.format(geradoEm, 'yyyy-MM-dd HH:mm')}"
              th:text="${#temporals.format(geradoEm, 'dd/MM/yyyy')} + ' às ' + ${#temporals.format(geradoEm, 'HH:mm')}">agora</time></p>
</footer>

</body>
</html>
